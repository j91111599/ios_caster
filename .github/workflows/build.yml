name: build-deb

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos and SDK
        run: |
          set -e
          export THEOS="$RUNNER_TEMP/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          ls "$THEOS/sdks" | head -5

      - name: Build package
        run: |
          set -e
          make THEOS_PACKAGE_SCHEME=rootless package FINALPACKAGE=1 DEBUG=0 2>&1 | tail -60
          ls -lh packages/ || true

      - name: Upload deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ykcaster-deb
          path: packages/*.deb
          if-no-files-found: warn
