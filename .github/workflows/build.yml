name: build-deb

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos and SDK
        run: |
          set -e
          export THEOS="$RUNNER_TEMP/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          rm -rf "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks" || true
          ls "$THEOS/sdks" | head -10
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Install ldid
        run: |
          set -e
          brew install ldid || brew install ProcursusTeam/ldid/ldid || true
          which ldid && ldid -v || echo "ldid not found, will try Theos bundled"
          ls "$THEOS/bin" | head -20

      - name: Build package
        shell: bash
        run: |
          set -eo pipefail
          make THEOS_PACKAGE_SCHEME=rootless package FINALPACKAGE=1 DEBUG=0
          echo "=== deb 文件 ==="
          find . -name '*.deb' -exec ls -lh {} \;

      - name: Upload deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ykcaster-deb
          path: "**/*.deb"
          if-no-files-found: warn
